[project]
name = "mermin-corpus"
version = "0.1.0"
description = "Fetch and probe tooling for the mermin microscopy ingest corpus"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.12",
    "httpx>=0.27",
    "numpy>=1.24",
    "tifffile>=2024.1",
    "bioio>=3.0",
    "bioio-ome-zarr>=2.0",
    "bioio-tifffile>=1.0",
]

[project.scripts]
mermin-corpus = "mermin_corpus.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermin_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["drive: requires the ASF-EX1 volume mounted"]
