[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mermin"
dynamic = ["version"]
description = "k-atic alignment analysis of fluorescence microscopy"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Alejandro Soto Franco" }]
dependencies = [
    "numpy>=2.1",
    "polars>=0.20",
    "scikit-image>=0.25",
    "scipy>=1.14.1",
    "matplotlib>=3.9.2",
    "tifffile>=2024.1",
    "bioio>=3.4.0",
    "bioio-ome-tiff>=1.0",
    "bioio-ome-zarr>=3.0.1",
    "bioio-tifffile>=1.3.0",
    "fsspec>=2024.12.0",
]

[project.optional-dependencies]
cellpose = ["cellpose>=4.0,<5"]
vendor-formats = ["bioio-czi>=2.0", "bioio-lif>=1.5", "bioio-nd2>=2.0"]

[tool.maturin]
python-source = "../python"
module-name = "mermin._native"
features = ["pyo3/extension-module"]
exclude = ["corpus/**", "docs/**", "numerical-tests/**", "mermin-tests/**"]

[tool.pytest.ini_options]
markers = ["corpus: requires the ASF-EX1 mermin-corpus volume mounted"]
