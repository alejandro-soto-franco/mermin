[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mermin"
dynamic = ["version"]
description = "k-atic alignment analysis of fluorescence microscopy"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Alejandro Soto Franco" }]
dependencies = [
    # bioio-ome-zarr below pulls in zarr>=3.1.0, which requires numpy>=2.0
    # outright, so numpy 2 is unavoidable anywhere in this graph: every
    # compiled dependency here must be a numpy-2-built release, not merely
    # one that declares numpy 2 support. numpy>=2.0, scipy>=1.13.0 and
    # scikit-image's numpy-2 floor are each bisected to the lowest version
    # that actually imports against numpy 2.0.0 on Python 3.11; the version
    # directly below each raises `ValueError: numpy.dtype size changed`
    # (scikit-image 0.22.0) or is outright unresolvable against
    # numpy==2.0.0 (scipy 1.12.0). Do not lower these without re-checking
    # against numpy 2, not against what each project's own advertised floor
    # claims.
    #
    # scikit-image's own floor is raised past that numpy-2 bisection to
    # 0.25.2 for a second, independent reason: `skimage.segmentation.watershed`
    # changed its boundary tie-breaking between 0.24 and 0.25, and that
    # change is not stable across the whole 0.25 line. 0.25.0 and 0.25.1 were
    # measured directly (not assumed from the 0.25.2/0.26.0 pair already
    # measured against 0.23/0.24): every one of the eight corpus goldens
    # fails against them, by 0.039% to 39.8% relative, the largest of those
    # hundreds of times past even the pre-tightening 1e-3 tolerance and the
    # smallest inside it. 0.25.2 and 0.26.0 reproduce
    # every golden bit-exactly. `scikit-image>=0.25.2` is therefore the
    # lowest release measured to be watershed-stable, not a claim that the
    # whole 0.25 line is. Do not lower this without re-measuring 0.25.0 and
    # 0.25.1 directly, not only that a version imports.
    "numpy>=2.0",
    "polars>=0.20",
    "scikit-image>=0.25.2",
    "scipy>=1.13.0",
    "tifffile>=2024.1",
    "bioio>=3.4.0",
    "bioio-ome-tiff>=1.0",
    # 2.0.0-3.0.0 pass a `storage_options` kwarg to `zarr.open_group` even
    # when empty; zarr>=3.3 raises TypeError for a non-URI path in that
    # case, which `_is_supported_image`'s bare `except Exception` swallows,
    # so every local OME-Zarr read reports as "unsupported" rather than
    # erroring. Fixed in 3.0.1; do not lower this without re-checking that.
    "bioio-ome-zarr>=3.0.1",
    "bioio-tifffile>=1.3.0",
    "fsspec>=2024.12.0",
]

[project.optional-dependencies]
cellpose = ["cellpose>=4.0,<5"]
vendor-formats = ["bioio-czi>=2.0", "bioio-lif>=1.5", "bioio-nd2>=2.0"]

[tool.maturin]
python-source = "../python"
module-name = "mermin._native"
features = ["pyo3/extension-module"]
exclude = ["corpus/**", "docs/**", "numerical-tests/**", "mermin-tests/**"]

[tool.pytest.ini_options]
markers = ["corpus: requires the ASF-EX1 mermin-corpus volume mounted"]
