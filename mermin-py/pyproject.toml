[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mermin"
dynamic = ["version"]
description = "k-atic alignment analysis of fluorescence microscopy"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Alejandro Soto Franco" }]
dependencies = [
    # bioio-ome-zarr below pulls in zarr>=3.1.0, which requires numpy>=2.0
    # outright, so numpy 2 is unavoidable anywhere in this graph: every
    # compiled dependency here must be a numpy-2-built release, not merely
    # one that declares numpy 2 support. numpy>=2.0, scipy>=1.13.0,
    # scikit-image>=0.23 and matplotlib>=3.8.4 are each bisected to the
    # lowest version that actually imports against numpy 2.0.0 on Python
    # 3.11; the version directly below each raises `ValueError: numpy.dtype
    # size changed` (scikit-image 0.22.0) or is outright unresolvable
    # against numpy==2.0.0 (scipy 1.12.0, matplotlib 3.8.0-3.8.3). Do not
    # lower these without re-checking against numpy 2, not against what
    # each project's own advertised floor claims.
    "numpy>=2.0",
    "polars>=0.20",
    "scikit-image>=0.23",
    "scipy>=1.13.0",
    "matplotlib>=3.8.4",
    "tifffile>=2024.1",
    "bioio>=3.4.0",
    "bioio-ome-tiff>=1.0",
    # 2.0.0-3.0.0 pass a `storage_options` kwarg to `zarr.open_group` even
    # when empty; zarr>=3.3 raises TypeError for a non-URI path in that
    # case, which `_is_supported_image`'s bare `except Exception` swallows,
    # so every local OME-Zarr read reports as "unsupported" rather than
    # erroring. Fixed in 3.0.1; do not lower this without re-checking that.
    "bioio-ome-zarr>=3.0.1",
    "bioio-tifffile>=1.3.0",
    "fsspec>=2024.12.0",
]

[project.optional-dependencies]
cellpose = ["cellpose>=4.0,<5"]
vendor-formats = ["bioio-czi>=2.0", "bioio-lif>=1.5", "bioio-nd2>=2.0"]

[tool.maturin]
python-source = "../python"
module-name = "mermin._native"
features = ["pyo3/extension-module"]
exclude = ["corpus/**", "docs/**", "numerical-tests/**", "mermin-tests/**"]

[tool.pytest.ini_options]
markers = ["corpus: requires the ASF-EX1 mermin-corpus volume mounted"]
